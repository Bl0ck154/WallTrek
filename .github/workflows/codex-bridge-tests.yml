name: Codex bridge tests
on:
  pull_request:
    paths:
      - 'Services/ImageGen/Codex/**'
      - 'Services/ImageGen/ImageModelCatalog.cs'
      - 'Services/ImageGen/ImageGenerationServiceFactory.cs'
      - 'Services/ImageGen/ImageModelOption.cs'
      - 'Views/SettingsView.*'
      - 'Views/MainView.xaml.cs'
      - 'tests/WallTrek.Codex.Tests/**'
      - 'WallTrek.csproj'
      - '.github/workflows/codex-bridge-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run offline fake bridge tests (no account auth)
        run: dotnet run --project tests/WallTrek.Codex.Tests/WallTrek.Codex.Tests.csproj --configuration Release
      - name: Build WinUI app
        run: dotnet build WallTrek.csproj --configuration Debug
