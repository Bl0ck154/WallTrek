name: Portable Windows x64 test build
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walltrek-portable-windows-x64
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish portable WinUI x64 (self-contained)
        shell: pwsh
        run: |
          dotnet publish WallTrek.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -p:PublishTrimmed=false -p:WindowsAppSDKSelfContained=true -o dist/WallTrek
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          if (-not (Test-Path dist/WallTrek/WallTrek.exe)) { throw "WallTrek.exe missing" }

          "Build commit: $env:GITHUB_SHA" | Set-Content -Path dist/WallTrek/BUILD_INFO.txt
          New-Item -ItemType Directory -Path dist/portable -Force | Out-Null
          Move-Item -Path dist/WallTrek -Destination dist/portable/WallTrek
          if (-not (Test-Path dist/portable/WallTrek/WallTrek.exe)) { throw "Portable layout missing" }

          $files = Get-ChildItem -Path dist/portable/WallTrek -File -Recurse
          $bytes = ($files | Measure-Object Length -Sum).Sum
          Write-Host "Portable folder: $($files.Count) files, $([math]::Round($bytes / 1MB, 1)) MiB"

      - name: Upload a single WallTrek folder
        uses: actions/upload-artifact@v4
        with:
          name: WallTrek-Portable-Windows-x64
          path: dist/portable/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          include-hidden-files: true
