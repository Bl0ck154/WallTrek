name: Portable Windows test build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: walltrek-portable-manual
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish portable WinUI x64
        shell: pwsh
        run: |
          dotnet publish WallTrek.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -p:PublishTrimmed=false -p:WindowsAppSDKSelfContained=true -o dist/WallTrek
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          if (-not (Test-Path dist/WallTrek/WallTrek.exe)) { throw "Missing WallTrek.exe" }
          "Commit: $env:GITHUB_SHA" | Set-Content -Path dist/WallTrek/BUILD_INFO.txt
          "Experimental Codex requires a reviewed, separately installed local image helper." | Add-Content -Path dist/WallTrek/BUILD_INFO.txt
          ((Get-FileHash dist/WallTrek/WallTrek.exe -Algorithm SHA256).Hash + "  WallTrek.exe") | Set-Content -Path dist/WallTrek/SHA256.txt
      - name: Upload portable test bundle
        uses: actions/upload-artifact@v4
        with:
          name: WallTrek-Windows-x64-portable-test
          path: dist/WallTrek/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
